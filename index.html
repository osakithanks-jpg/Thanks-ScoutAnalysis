<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンクスパートナーズ | スカウト実績・求人管理一元化ツール</title>

  <!-- Google Web Fonts (Noto Sans JP, Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- スタイルシート (ホテルライク デザイン) -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Chart.js & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app-layout">
    <!-- 管理者モード領域 (管理者時のみ表示) -->
    <div id="admin-banner-container" style="display: none;" class="admin-banner">
      管理者モード
    </div>

    <div class="layout-body">
      <!-- サイドバーナビゲーション (6大メニュー) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <i data-lucide="layers" style="width:22px; height:22px; color:#C5A059;"></i>
          <div>
            <h1>サンクスパートナーズ</h1>
            <span>スカウト・求人一元管理</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="#daily-entry" class="nav-item active" data-view="daily-entry">
            <i data-lucide="edit-3"></i>
            <span>本日の実績入力</span>
          </a>
          <a href="#dashboard" class="nav-item" data-view="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>ダッシュボード</span>
          </a>
          <a href="#jobs" class="nav-item" data-view="jobs">
            <i data-lucide="briefcase"></i>
            <span>求人</span>
          </a>
          <a href="#analysis" class="nav-item" data-view="analysis">
            <i data-lucide="search"></i>
            <span>分析</span>
          </a>
          <a href="#knowledge" class="nav-item" data-view="knowledge">
            <i data-lucide="book-open"></i>
            <span>求人振り返り・ナレッジ</span>
          </a>
          <a href="#scout-messages" class="nav-item" data-view="scout-messages">
            <i data-lucide="file-text"></i>
            <span>スカウト文面</span>
          </a>
          <a href="#auto-scout" class="nav-item" data-view="auto-scout">
            <i data-lucide="bot"></i>
            <span>自動スカウト実績</span>
          </a>
          <a href="#inbound-entry" class="nav-item" data-view="inbound-entry">
            <i data-lucide="arrow-down-left"></i>
            <span>直接エントリー(インバウンド)</span>
          </a>
          <a href="#data-management" class="nav-item" data-view="data-management">
            <i data-lucide="database"></i>
            <span>データ管理 (管理者)</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <p>Scout Analytics v3.1</p>
          <p>© Thanks Partners Inc.</p>
        </div>
      </aside>

      <!-- メインコンテンツ領域 -->
      <div class="main-wrapper">
        <header class="top-bar">
          <h2 class="page-title" id="page-title">本日の実績入力</h2>

          <div class="top-bar-right">
            <!-- 自動保存ステータス表示 -->
            <div id="save-status-container" class="save-status-indicator" style="display: none;"></div>

            <!-- 現在選択中担当者 -->
            <div id="current-staff-display" class="current-staff-badge" title="担当者を切り替える">
              <i data-lucide="user" style="width: 14px; height: 14px;"></i>
              <span id="current-staff-name">未選択</span>
            </div>

            <!-- サブメニューボタン群 -->
            <button id="btn-notifications" class="btn btn-secondary btn-sm" title="通知">
              <i data-lucide="bell" style="width: 14px; height: 14px;"></i>
            </button>
            <button id="btn-guide" class="btn btn-secondary btn-sm" title="使い方">
              <i data-lucide="help-circle" style="width: 14px; height: 14px;"></i>
              <span>使い方</span>
            </button>
            <button id="btn-admin-toggle" class="btn btn-secondary btn-sm" title="管理者モード">
              <i data-lucide="shield" style="width: 14px; height: 14px;"></i>
              <span>管理者モード</span>
            </button>
            <button id="btn-app-info" class="btn btn-secondary btn-sm" title="アプリ情報">
              <i data-lucide="info" style="width: 14px; height: 14px;"></i>
            </button>
          </div>
        </header>

        <main class="main-content" id="main-view-container">
          <!-- JavaScriptにて動的描画 -->
        </main>
      </div>
    </div>
  </div>

  <!-- モーダルダイアログ用コンテナ -->
  <div id="modal-container"></div>

  <!-- アプリケーションスタンドアロンスクリプト (CORS制限なし・file://直開対応) -->
  <script src="./js/bundle.js"></script>
</body>
</html>
